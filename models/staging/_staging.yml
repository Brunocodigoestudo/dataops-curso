version: 2

models:
  - name: stg_clientes
    columns:
      - name: id_cliente
        data_tests:
          - unique
          - not_null
  - name: stg_pedidos
    columns:
      - name: id_pedido
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['aberto', 'pago', 'cancelado']
      - name: id_cliente
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_clientes')
                field: id_cliente
